name: Document Core

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: document-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.0.3-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Test core
        run: swift test
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test core on macOS
        run: swift test
      - name: Build for iOS Simulator
        run: >-
          xcodebuild -scheme GotItCanvasUI
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/GotItDerivedData"
          CODE_SIGNING_ALLOWED=NO build
      - name: Generate demo project
        run: |
          brew install xcodegen
          cd Examples/GotItDemo
          xcodegen generate
      - name: Build demo for iOS Simulator
        run: >-
          xcodebuild -project Examples/GotItDemo/GotItDemo.xcodeproj
          -scheme GotItDemo -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/GotItDemoDerivedData"
          CODE_SIGNING_ALLOWED=NO build
      - name: Test native editor on iPad and iPhone
        timeout-minutes: 15
        run: |
          python3 - <<'PYTHON'
          import json, subprocess, os
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          available = [d for runtime, items in devices.items() if "iOS" in runtime for d in items if d["isAvailable"]]
          results = []
          for family in ["iPad", "iPhone"]:
              device = next(d for d in available if family in d["name"])
              result = subprocess.run(["xcodebuild", "-project", "Examples/GotItDemo/GotItDemo.xcodeproj", "-scheme", "GotItDemo", "-destination", "platform=iOS Simulator,id=" + device["udid"], "-derivedDataPath", os.environ["RUNNER_TEMP"] + "/GotItDemoDerivedData", "-resultBundlePath", os.environ["RUNNER_TEMP"] + "/" + family + ".xcresult", "-parallel-testing-enabled", "NO", "-test-timeouts-enabled", "YES", "-default-test-execution-time-allowance", "120", "-maximum-test-execution-time-allowance", "180", "CODE_SIGNING_ALLOWED=NO", "test"], check=False)
              results.append(result.returncode)
          if any(results): raise SystemExit(1)
          PYTHON
      - name: Export editor screenshots
        if: always()
        run: |
          for family in iPad iPhone; do
            if [ -d "$RUNNER_TEMP/$family.xcresult" ]; then
              xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$family.xcresult" --output-path "$RUNNER_TEMP/screenshots/$family" || true
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-editor-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
