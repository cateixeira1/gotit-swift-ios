name: Document Core

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: document-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.0.3-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Test core
        run: swift test
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test core on macOS
        run: swift test
      - name: Build for iOS Simulator
        run: >-
          xcodebuild -scheme GotItCanvasUI
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/GotItDerivedData"
          CODE_SIGNING_ALLOWED=NO build
      - name: Generate demo project
        run: |
          brew install xcodegen
          cd Examples/GotItDemo
          xcodegen generate
      - name: Build demo for iOS Simulator
        run: >-
          xcodebuild -project Examples/GotItDemo/GotItDemo.xcodeproj
          -scheme GotItDemo -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/GotItDemoDerivedData"
          CODE_SIGNING_ALLOWED=NO build
