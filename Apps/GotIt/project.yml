name: GotItApp
options:
  bundleIdPrefix: com.gotit.prototype
  deploymentTarget:
    iOS: '18.0'
packages:
  GotIt:
    path: ../..
targets:
  GotItApp:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        SUPPORTS_MACCATALYST: YES
        SWIFT_VERSION: '6.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gotit.prototype.demo
    dependencies:
      - package: GotIt
        product: GotItDomain
      - package: GotIt
        product: GotItPersistence
      - package: GotIt
        product: GotItCanvas
      - package: GotIt
        product: GotItCanvasUI
  GotItAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GotItApp
      - package: GotIt
        product: GotItDomain
      - package: GotIt
        product: GotItCanvas
      - package: GotIt
        product: GotItCanvasUI
  GotItAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GotItApp
schemes:
  GotItApp:
    build:
      targets:
        GotItApp: all
    test:
      targets:
        - GotItAppTests
        - GotItAppUITests
